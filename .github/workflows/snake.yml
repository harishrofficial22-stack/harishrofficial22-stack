name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake dark
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: harishrofficial22-stack
          outputs: |
            dist/snake-dark.svg?color_snake=%2322D3EE&color_dots=2d3343,394356,4c5670,7c8ba0,22d3ee
            dist/snake-light.svg?palette=github-light

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
